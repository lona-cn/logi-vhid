name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_call:
    inputs:
      skip_release_build:
        description: The release workflow builds and verifies its own native artifacts.
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  check:
    name: Windows / Rust ${{ matrix.rust }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.96.0", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install release build tooling
        run: python -m pip install -r tools/requirements-release.txt
      - name: Install Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Run Rust tests without desktop input
        run: cargo test --locked --workspace --all-targets
      - name: Compile documentation examples
        run: cargo test --locked --workspace --doc
      - name: Build documentation
        run: cargo rustdoc --locked -p logi-vhid --lib -- -D warnings
      - name: Run Python tests without desktop input
        run: python -B -m unittest discover -s python/tests -p "test_*.py"
      - name: Run release tooling tests
        run: python -B -m unittest discover -s tools -p "test_*.py"
      - name: Build core release artifacts
        if: ${{ !inputs.skip_release_build }}
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p logi-vhid
      - name: Build MCP release executable
        if: ${{ !inputs.skip_release_build }}
        run: cargo build --locked --release --target x86_64-pc-windows-msvc -p logi-vhid-mcp --bin logi-vhid-mcp
      - name: Smoke test command line
        if: ${{ !inputs.skip_release_build }}
        run: cargo run --locked --release --target x86_64-pc-windows-msvc -p logi-vhid --bin logi-vhid-demo -- help
      - name: Smoke test MCP without desktop input
        if: ${{ !inputs.skip_release_build }}
        run: |
          $metadata = cargo metadata --locked --format-version 1 --no-deps | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $exe = Join-Path $metadata.target_directory "x86_64-pc-windows-msvc/release/logi-vhid-mcp.exe"
          python tools/mcp_smoke.py --exe "$exe"
      - name: Check crates.io package without uploading
        run: cargo publish -p logi-vhid --dry-run --locked --registry crates-io
