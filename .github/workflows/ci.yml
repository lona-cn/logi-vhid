name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Windows / Rust ${{ matrix.rust }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.96.0", stable]
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Run Rust tests without desktop input
        run: cargo test --all-targets
      - name: Compile documentation examples
        run: cargo test --doc
      - name: Build documentation
        run: cargo rustdoc --lib -- -D warnings
      - name: Run Python tests without desktop input
        run: python -B -m unittest discover -s python -p "test_*.py"
      - name: Build release artifacts
        run: cargo build --release
      - name: Smoke test command line
        run: cargo run --release -- help
      - name: Check crates.io package without uploading
        run: cargo publish --dry-run --locked --registry crates-io
