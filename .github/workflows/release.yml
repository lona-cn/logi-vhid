name: Release

on:
  push:
    tags: ["v*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  checks:
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml
    with:
      skip_release_build: true

  build:
    if: github.event_name == 'push'
    needs: checks
    runs-on: windows-latest
    env:
      RUSTUP_TOOLCHAIN: "1.96.0"
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          architecture: x64
      - name: Install pinned Rust toolchain
        run: rustup toolchain install $env:RUSTUP_TOOLCHAIN --profile minimal
      - name: Install release build tooling
        run: python -m pip install -r tools/requirements-release.txt
      - name: Build SDK, wheel, executable, MCPB and Registry metadata once
        run: python tools/release.py build --tag "$env:RELEASE_TAG" --dist dist
      - name: Verify five release assets without desktop input
        run: python tools/release.py verify --tag "$env:RELEASE_TAG" --dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-assets
          path: dist/*
          if-no-files-found: error
          compression-level: 0

  draft:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-assets
          path: dist
      - name: Create a draft for manual hardware verification
        shell: bash
        run: |
          flags=(--draft --verify-tag --title "$RELEASE_TAG" --notes-file dist/RELEASE_NOTES.md)
          if [[ "$RELEASE_TAG" == *-* ]]; then
            flags+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" dist/*.zip dist/*.whl dist/*.exe dist/*.mcpb dist/server.json dist/SHA256SUMS "${flags[@]}"

  verify-published:
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ github.event.release.tag_name }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install asset verification tooling
        run: python -m pip install -r tools/requirements-release.txt
      - name: Download the published assets without rebuilding
        run: >-
          gh release download "$RELEASE_TAG" --dir dist
          --pattern "logi-vhid-*.zip" --pattern "logi_vhid-*.whl"
          --pattern "logi-vhid-mcp-*.exe" --pattern "logi-vhid-mcp-*.mcpb"
          --pattern server.json --pattern SHA256SUMS
      - name: Verify published hashes, versions, bundle and Registry consistency
        run: python tools/release.py verify-assets --tag "$RELEASE_TAG" --dist dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pypi-wheel
          path: dist/*.whl
          if-no-files-found: error
          compression-level: 0

  pypi:
    if: github.event_name == 'release'
    needs: verify-published
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/logi-vhid
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pypi-wheel
          path: dist
      - name: Publish the verified wheel with Trusted Publishing
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
