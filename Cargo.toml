[workspace]
members = ["crates/logi-vhid", "crates/logi-vhid-mcp"]
default-members = ["crates/logi-vhid", "crates/logi-vhid-mcp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.96"
license = "MIT"
repository = "https://github.com/lona-cn/logi-vhid"
readme = "README.md"

[profile.release]
opt-level = 2
