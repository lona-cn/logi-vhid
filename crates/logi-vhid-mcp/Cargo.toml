[package]
name = "logi-vhid-mcp"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
description = "Local stdio MCP server for Logitech virtual HID input"
publish = false

[[bin]]
name = "logi-vhid-mcp"
path = "src/main.rs"

[dependencies]
logi-vhid = { path = "../logi-vhid", version = "0.1.1" }
rmcp = { version = "=3.7.0", default-features = false, features = ["server", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "signal", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
windows-sys = { version = "0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_RemoteDesktop", "Win32_System_StationsAndDesktops", "Win32_UI_WindowsAndMessaging", "Win32_UI_HiDpi"] }

[dev-dependencies]
rmcp = { version = "=3.7.0", default-features = false, features = ["client", "transport-child-process"] }
tokio = { version = "1", features = ["process"] }
